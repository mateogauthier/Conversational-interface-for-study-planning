services:
  # Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI:-http://localhost:3000}
    container_name: study-planning-frontend
    ports:
      - "3000:80"
    depends_on:
      - fastapi-app
    networks:
      - study-planning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: study-planning-mongodb
    ports:
      - "27017:27017"  # Exposed for development access
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    volumes:
      - mongo-data:/data/db
    networks:
      - study-planning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ChromaDB Vector Database Service
  chromadb-server:
    image: chromadb/chroma:latest
    container_name: study-planning-chroma
    ports:
      - "8001:8000"  # Exposed for development access
    volumes:
      - chroma_db:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=${CHROMA_ANONYMIZED_TELEMETRY:-FALSE}
    networks:
      - study-planning-network
    restart: unless-stopped

  # Agent Tools API Service
  agent-api:
    build:
      context: ./AGENT_API
      dockerfile: Dockerfile
    container_name: study-planning-agent-api
    ports:
      - "8002:8002"
    environment:
      # Main API URL for HTTP communication
      - MAIN_API_URL=http://fastapi-app:8000
      # CORS Configuration
      - CORS_ORIGINS=http://localhost:8000,http://localhost:3000,http://localhost:8002
    volumes:
      # Bind mount agent API code for hot-reload only
      - ./AGENT_API/app:/agent_api/app
    depends_on:
      fastapi-app:
        condition: service_healthy
    networks:
      - study-planning-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # FastAPI Application Service
  fastapi-app:
    build:
      context: ./CODE
      dockerfile: Dockerfile
    container_name: study-planning-api
    ports:
      - "8000:8000"
    environment:
      # MongoDB Configuration
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/?authSource=admin
      - MONGO_DATABASE_NAME=${MONGO_DATABASE_NAME:-study_planning}
      - MONGO_MAX_POOL_SIZE=${MONGO_MAX_POOL_SIZE:-50}
      - MONGO_MIN_POOL_SIZE=${MONGO_MIN_POOL_SIZE:-10}
      # ChromaDB Configuration
      - CHROMADB_MODE=${CHROMADB_MODE:-client}
      - CHROMADB_HOST=${CHROMADB_HOST:-chromadb-server}
      - CHROMADB_PORT=${CHROMADB_PORT:-8000}
      # Ollama Configuration
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      # CORS Configuration
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      # Auth0 Backend Configuration
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_API_AUDIENCE=${AUTH0_API_AUDIENCE}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      # RAG & LLM Configuration
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-spanish}
      - RESPONSE_INSTRUCTIONS=${RESPONSE_INSTRUCTIONS:-}
      - MAX_CONTEXT_LENGTH=${MAX_CONTEXT_LENGTH:-1500}
      # Agent Configuration
      - AGENT_PROVIDER=${AGENT_PROVIDER:-local}
    volumes:
      # Bind mount source code for hot-reload (DEVELOPMENT ONLY)
      - ./CODE:/app
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb-server:
        condition: service_started
      ollama:
        condition: service_healthy
    networks:
      - study-planning-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: study-planning-ollama
    ports:
      # Only expose if you need to access Ollama directly from host
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - study-planning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  study-planning-network:
    driver: bridge

volumes:
  # Persistent data volumes
  chroma_db:
    driver: local
  ollama-models:
    driver: local
  mongo-data:
    driver: local
