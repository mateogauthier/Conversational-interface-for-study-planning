services:
  # Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_AUTH0_DOMAIN: dev-eex6fdnnmp2ps746.us.auth0.com
        VITE_AUTH0_CLIENT_ID: WWACpUIWjEOo5tc0KtYANfT15G6rteCM
        VITE_AUTH0_AUDIENCE: https://study-planning-api
        VITE_AUTH0_REDIRECT_URI: http://localhost:3000
    container_name: study-planning-frontend
    ports:
      - "3000:80"
    depends_on:
      - fastapi-app
    networks:
      - study-planning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: study-planning-mongodb
    ports:
      - "27017:27017"  # Exposed for development access
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo-data:/data/db
    networks:
      - study-planning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # FastAPI Application Service
  fastapi-app:
    build:
      context: ./CODE
      dockerfile: Dockerfile
    container_name: study-planning-api
    ports:
      - "8000:8000"
    environment:
      # MongoDB Configuration (override defaults)
      - MONGO_URI=mongodb://admin:password@mongodb:27017/?authSource=admin
      - MONGO_DATABASE_NAME=study_planning
      # Ollama Configuration (override defaults)
      - OLLAMA_BASE_URL=http://ollama:11434
      # CORS Configuration (override defaults)
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    volumes:
      # Bind mount source code for hot-reload (DEVELOPMENT ONLY)
      - ./CODE:/app
      # Named volumes for persistent data
      - uploads:/app/data/uploads
      - chroma_db:/app/data/chroma_db
    depends_on:
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - study-planning-network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: study-planning-ollama
    ports:
      # Only expose if you need to access Ollama directly from host
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - study-planning-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    # Uncomment below for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  study-planning-network:
    driver: bridge

volumes:
  # Persistent data volumes
  uploads:
    driver: local
  chroma_db:
    driver: local
  ollama-models:
    driver: local
  mongo-data:
    driver: local
