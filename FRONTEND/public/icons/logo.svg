<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#7C3AED" opacity="0.15"/>
  
  <!-- Main chat bubble (AI assistant) -->
  <rect x="50" y="70" width="80" height="50" rx="12" fill="#7C3AED"/>
  <polygon points="60,120 50,130 70,120" fill="#7C3AED"/>
  
  <!-- AI chat lines (representing conversation) -->
  <line x1="65" y1="85" x2="115" y2="85" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="95" x2="105" y2="95" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="105" x2="110" y2="105" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- User chat bubble (student) -->
  <rect x="90" y="100" width="60" height="40" rx="10" fill="white" stroke="#7C3AED" stroke-width="3"/>
  <polygon points="140,140 150,148 140,140" fill="white" stroke="#7C3AED" stroke-width="3" stroke-linejoin="miter"/>
  
  <!-- User chat lines -->
  <line x1="100" y1="115" x2="135" y2="115" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="125" x2="130" y2="125" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Graduation cap (small, on top) -->
  <polygon points="100,45 118,50 100,55 82,50" fill="#7C3AED"/>
  <rect x="98.5" y="55" width="3" height="8" fill="#7C3AED"/>
  
  <!-- Data/analytics dots (representing data interaction) -->
  <circle cx="155" cy="75" r="3" fill="#7C3AED"/>
  <circle cx="165" cy="75" r="3" fill="#7C3AED"/>
  <circle cx="160" cy="83" r="3" fill="#7C3AED"/>
  
  <!-- Connecting lines for data visualization -->
  <line x1="155" y1="75" x2="165" y2="75" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
  <line x1="155" y1="75" x2="160" y2="83" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
  <line x1="165" y1="75" x2="160" y2="83" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
</svg>