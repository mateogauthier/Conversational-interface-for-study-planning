<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Book cover/base -->
  <rect x="50" y="60" width="100" height="80" fill="#7C3AED" rx="3"/>
  
  <!-- Left page (static) -->
  <rect x="55" y="65" width="45" height="70" fill="white" opacity="0.9"/>
  
  <!-- Right page (animating) -->
  <g id="rightPage">
    <rect x="100" y="65" width="45" height="70" fill="white">
      <animate attributeName="width" 
               values="45;2;45" 
               dur="1.5s" 
               repeatCount="indefinite"/>
      <animate attributeName="opacity" 
               values="1;0.3;1" 
               dur="1.5s" 
               repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Page turning effect (the flipping page) -->
  <rect x="100" y="65" width="45" height="70" fill="#E5E7EB">
    <animate attributeName="width" 
             values="0;45;0" 
             dur="1.5s" 
             repeatCount="indefinite"/>
    <animate attributeName="x" 
             values="100;55;100" 
             dur="1.5s" 
             repeatCount="indefinite"/>
  </rect>
  
  <!-- Page lines for detail -->
  <line x1="60" y1="75" x2="90" y2="75" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="85" x2="90" y2="85" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="95" x2="90" y2="95" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="105" x2="90" y2="105" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
  
  <line x1="105" y1="75" x2="140" y2="75" stroke="#7C3AED" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" 
             values="0.3;0;0.3" 
             dur="1.5s" 
             repeatCount="indefinite"/>
  </line>
  <line x1="105" y1="85" x2="140" y2="85" stroke="#7C3AED" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" 
             values="0.3;0;0.3" 
             dur="1.5s" 
             repeatCount="indefinite"/>
  </line>
  <line x1="105" y1="95" x2="140" y2="95" stroke="#7C3AED" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" 
             values="0.3;0;0.3" 
             dur="1.5s" 
             repeatCount="indefinite"/>
  </line>
  <line x1="105" y1="105" x2="140" y2="105" stroke="#7C3AED" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" 
             values="0.3;0;0.3" 
             dur="1.5s" 
             repeatCount="indefinite"/>
  </line>
  
  <!-- Book spine -->
  <rect x="98" y="60" width="4" height="80" fill="#5B21B6"/>
</svg>